name: Generar corpus documental (preliminar)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/construir.py'
      - 'scripts/auditar.py'
      - 'scripts/diagnostico_fuente.py'
      - 'scripts/verificar_integridad.py'
      - 'scripts/cotejar_bcn.py'
      - '.github/workflows/construir-corpus.yml'
permissions:
  contents: write
jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ejecutar generador
        run: python scripts/construir.py
      - name: Verificar JSON sintácticamente
        run: python -m json.tool datos/versos.json > /dev/null
      - name: Diagnosticar fuentes originales
        run: python scripts/diagnostico_fuente.py
      - name: Auditar numeración y cotejar fuente
        run: python scripts/auditar.py
      - name: Verificar integridad técnica (obligatorio)
        run: python scripts/verificar_integridad.py
      - name: Preparar cotejo independiente con edición BCN
        run: python -m pip install --quiet pymupdf rapidfuzz
      - name: Cotejar todos los versos frente a edición BCN
        run: python scripts/cotejar_bcn.py
      - name: Incorporar corpus verificado a main
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add obra/ datos/ fuentes/gutenberg-14765-original.txt fuentes/gutenberg-15066-original.txt fuentes/informe-generacion.json
          if ! git diff --cached --quiet; then
            git commit -m "data: corpus técnico validado (7210 versos, 46 cantos) [skip ci]"
            git push origin HEAD:main
          fi
      - name: Publicar paquete para revisión (no modifica main)
        uses: actions/upload-artifact@v4
        with:
          name: martin-fierro-corpus-PRELIMINAR
          path: |
            obra/
            datos/
            fuentes/
          retention-days: 30
