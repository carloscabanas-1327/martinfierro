name: Validar portal Astro
on:
  push:
    branches:
      - main
      - desarrollo/portal-astro-lectura
      - 'diseno/**'
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'astro.config.mjs'
      - 'tsconfig.json'
      - '.github/workflows/validar-portal.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Compilar el portal completo
        run: npm run build
      - name: Comprobar páginas e índice
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('dist')
          assert (root/'index.html').is_file()
          assert (root/'buscar/index.html').is_file()
          assert (root/'temas/index.html').is_file()
          assert (root/'leer/ida/1/index.html').is_file()
          assert (root/'leer/vuelta/33/index.html').is_file()
          index=json.loads((root/'indice-versos.json').read_text(encoding='utf-8'))
          assert len(index)==7210, len(index)
          assert sum(1 for v in index if v['parte']=='ida')==2316
          assert sum(1 for v in index if v['parte']=='vuelta')==4894
          cantos=list(root.glob('leer/*/[0-9]*/index.html'))
          assert len(cantos)==46,len(cantos)
          for v in index:
            html=root/f"leer/{v['parte']}/{v['canto']}/index.html"
            assert html.exists()
          print('OK: 46 cantos, 7210 versos y rutas HTML construidas')
          PY
      - name: Probar buscador del índice general
        run: node scripts/test-indice-search.mjs
      - name: Auditar enlaces y cobertura del índice general
        run: python scripts/auditar-enlaces.py
      - name: Validar navegación española y grafo de enlaces
        run: |
          test -f dist/buscar-documentos/index.html
          python scripts/auditar-grafo-es.py dist auditoria-grafo-es.json
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('auditoria-grafo-es.json').read_text())
          assert not report['unreachable_from_home'],report['unreachable_from_home']
          assert not report['internal_links_unresolved'],report['internal_links_unresolved']
          html=Path('dist/index.html').read_text()
          assert '/buscar-documentos/' in html
          assert '/indice-general/' in html
          assert 'Lectura y herramientas' in html
          print('Navegación ES: destinos, cobertura y buscador documental OK')
          PY
      - name: Guardar reporte de navegación
        uses: actions/upload-artifact@v4
        with:
          name: navegacion-es-grafo
          path: auditoria-grafo-es.json
          retention-days: 14
      - name: Auditar enlaces externos (sin bloquear compilación por anti-bots)
        continue-on-error: true
        run: python scripts/auditar-externos.py
      - name: Guardar informe de URL externas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-externos-es
          path: auditoria-externos.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Preparar Chromium para control visual
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Revisar seis anchos y zoom al 200 por ciento
        run: |
          python3 -m http.server 4322 --directory dist >/tmp/mf-preview.log 2>&1 &
          node scripts/auditar-responsive.mjs
      - name: Guardar capturas y reporte responsive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-responsive-es
          path: auditoria-responsive/
          if-no-files-found: ignore
          retention-days: 14
      - name: Guardar versión de prueba
        uses: actions/upload-artifact@v4
        with:
          name: portal-astro-completo-preview
          path: dist/
          retention-days: 14
